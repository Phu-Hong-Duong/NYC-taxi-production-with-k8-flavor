[project]
name = "taxi-mlops"
version = "0.0.1"
description = "NYC taxi MLOps production mockup: Flyte + MLflow + KServe + Feast on kind"
requires-python = ">=3.12"
# Dependencies are added AT M0 with versions observed from live sources that day,
# recorded in CLAUDE.md's pin table. Do not pre-pin here from memory.
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
    "dvc>=3.67.1",
    "pandas>=3.0.5",
    "pandera>=0.32.1",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: no cluster required (CI runs these on every PR)",
  "integration: requires a running kind cluster",
  "smoke: acceptance demos against the deployed stack",
]
addopts = "-m 'not integration and not smoke'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxi_mlops"]
