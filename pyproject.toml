[project]
name = "taxi-mlops"
version = "0.0.1"
description = "NYC taxi MLOps production mockup: Flyte + MLflow + KServe + Feast on kind"
requires-python = ">=3.12"
# Dependencies are added AT M0 with versions observed from live sources that day,
# recorded in CLAUDE.md's pin table. Do not pre-pin here from memory.
dependencies = [
    "boto3>=1.43.72",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
    "dvc>=3.67.1",
    "evidently>=0.7.21,<0.8",
    "flaml>=2",
    "flyte>=2.6,<3",
    "lightgbm>=4.7.0",
    "mlflow-skinny>=3.15,<4",
    "optuna>=4",
    "pandas>=3.0.5",
    "pandera>=0.32.1",
    "psycopg[binary]>=3",
    "pyarrow>=25.0.1",
    "pyproj>=3.7.2",
    "pyshp>=3.1.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "xgboost>=3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: no cluster required (CI runs these on every PR)",
  "integration: requires a running kind cluster",
  "smoke: acceptance demos against the deployed stack",
  # F-047 (M8-S1): reads a TRACKED RECORD under automation/runs/ at call time.
  # Those records are host artifacts and `.dockerignore` correctly keeps them out
  # of the task image, so the in-image run (`make image-smoke`) deselects this
  # marker — the ONLY place it is deselected. It is not a skip flag: on the host
  # and in CI these run, and they are how a gate's replay inputs stay checkable.
  "needs_records: reads a tracked record under automation/runs/ (host-only)",
]
addopts = "-m 'not integration and not smoke'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxi_mlops"]
