# All knobs live in configs/, none in code. Filled at M1/M2; shape fixed now.
data:
  train_months: ["2019-01", "2019-02", "2019-03", "2019-04", "2019-05", "2019-06"]
  val_month: "2019-07"
  test_month: "2019-08"
target: trip_duration_minutes

# ---------------------------------------------------------------- features ---
# Feature set v1 (M2-S2, role:MLE) — QUOTE-TIME PURE: every column here is
# knowable at the moment a rider asks "how long will this take?".
#
# The INCLUDE list is a knob. The EXCLUDE list is NOT, and is not here: it lives
# in `taxi_mlops.features.quote_time.EXCLUSIONS` with a reason per column, and a
# guard refuses any feature matrix that contains one. The asymmetry is
# deliberate and is the same argument M2-S1 made about first-match attribution:
# a switch that can break an invariant is a trapdoor, not a knob. Adding a
# column below that the registry excludes fails loudly (FeatureLeakageError),
# so this file cannot quietly re-admit leakage.
features:
  version: v1
  # Derived from tpep_pickup_datetime — the ONE timestamp a quote request has.
  # `month` is absent BY LAW (CLAUDE.md): the target mean rises 17.3% Jan->Jun,
  # so month is a reporting dimension and a model that learns it learns the
  # calendar, not the city.
  temporal: ["hour", "dayofweek"]
  # Carried straight through from the contract's blessed columns.
  passthrough: ["PULocationID", "DOLocationID", "passenger_count"]
  # Declared to LightGBM as categorical. Zone ids are labels, not magnitudes:
  # zone 264 is not "two more than 262", and 264/265 are "unknown", not places
  # (eda_report.md §9). dayofweek joins them because Saturday is not 6/7ths of
  # Sunday; `hour` stays ordered on purpose — range splits (the morning peak,
  # the evening peak) are exactly what a tree should be allowed to make.
  categorical: ["PULocationID", "DOLocationID", "dayofweek"]

# --------------------------------------------------------------- baselines ---
# The honest reference floor, RE-DERIVED here through the model's own evaluator
# rather than quoted from the EDA's SQL (gotcha #15: a reported number comes
# from taxi_mlops.training.evaluate and nowhere else).
baselines:
  # Fitted on train only. Unseen groups fall back to the constant train median —
  # the SAME single-level fallback eda_report.md §11 used, so its 3.7170 val MAE
  # is a number this code path can be checked against. A deeper hierarchy
  # (PU,DO -> hour,dow -> global) would predict better and would no longer be
  # the published floor; if a later story wants it, it is a NEW baseline with a
  # new name, never an edit to this one.
  group_keys: ["hour", "dayofweek", "PULocationID", "DOLocationID"]
  # M3-S1 took that option, under a new name and without touching the line above
  # (F-010). `baseline-group-median-od-fallback` answers a row whose full key
  # train never saw with the median of its (PU, DO) pair, and only then with the
  # global median. It is still a `GROUP BY` — no new column, no new model, the
  # same train rows — which is exactly why it is the harder bar: it asks what a
  # booster buys over the BEST simple predictor rather than over the first one.
  # Must be a strict subset of group_keys; a backoff level that is not a
  # coarsening is a different lookup wearing the same name.
  od_fallback_keys: ["PULocationID", "DOLocationID"]

# ---------------------------------------------------------------- evaluate ---
evaluate:
  # KPI-10's tolerance. A DA proposal, not a settled SLO (kpi_definitions.md);
  # M5 owns the SLO and moving this number is a PO fork, not an edit.
  tolerance_minutes: 5.0
  # Row-level predictions for the DA error memo land here at M2-S4. Declared now
  # so the path has one owner; S2 writes no predictions.
  predictions_dir: "data/predictions"

# ------------------------------------------------------------------- model ---
model:
  name: lightgbm-v1
  # TARGET TRANSFORM — the craft call E-1 asked M2 to PROVE, not assume.
  # `none` for v1: KPI-09 is MAE in MINUTES, and objective `l1` minimises
  # exactly that on exactly that scale. Training on log1p and exponentiating
  # back optimises the median of a different loss and is only a win if the
  # metric is relative. The `log1p` setting exists and is run as a labelled
  # ablation (--ablation) so the claim is a measurement, not an opinion.
  target_transform: none      # none | log1p
  lightgbm:
    objective: l1             # == the reported metric; see above
    metric: l1
    learning_rate: 0.05
    num_leaves: 255
    min_data_in_leaf: 500     # 42M rows: small leaves would memorise OD pairs
    feature_fraction: 1.0     # only five features — sampling them is noise
    bagging_fraction: 0.8
    bagging_freq: 1
    max_cat_threshold: 64
    cat_smooth: 20.0
    num_threads: 16           # 20 cores observed; 4 left for the rest of WSL
    seed: 20260817
    deterministic: true       # a re-run must reproduce the number it reported
    verbose: -1
  num_boost_round: 500
  # Early stopping reads VAL. That is what val is for; TEST is never touched by
  # training or selection — it is the month M2-S3's promotion gate judges on.
  early_stopping_rounds: 30
  log_period: 50

# -------------------------------------------------------------------- gate ---
# THE PROMOTION GATE (M2-S3, role:MLE). The one place this program says "no".
#
# LOOSENING ANYTHING BELOW IS A PO FORK, NOT AN EDIT (CLAUDE.md). Tightening is
# the MLE's to argue for. The margin is recorded here with its reasoning because
# a threshold whose argument lives in someone's head gets rounded down the first
# time a model misses it.
gate:
  # Judged on TEST, and the gate raises if handed anything else. Early stopping
  # reads VAL (model.early_stopping_rounds), so a verdict on val would score a
  # model against a month it has already been fitted to once.
  holdout_split: test
  # The HONEST floor. The constant-median floor (7.6667 min test) is NOT the bar
  # and never will be: against it, v1's 3.2608 reads as a 57% triumph, which is
  # the number a demo quotes and a rider never feels. Passing that baseline in
  # here raises rather than flatters.
  #
  # M3-S1 CHANGED THIS LINE, and the change is a TIGHTENING (F-010, Design
  # Review DR-06 §3 — the two halves of this decision are findable from each
  # other, per AI-4). It was `baseline-group-median` through M2. That floor
  # answers a trip whose (hour, dow, PU, DO) cell train never saw with the
  # GLOBAL median — 11.15 minutes for everyone, from Midtown-to-Midtown to
  # JFK-to-Brooklyn — and 1.479% of test rows land there. M2-S4's memo measured
  # what that is worth: 75.4% of the champion's entire advantage over the floor
  # is bought on those 1.48% of rows. Give the same lookup one more backoff
  # level and 98.9% of them resolve to a real (PU, DO) cell; the floor's test
  # MAE falls 3.5090 -> 3.3518 and v1's margin collapses 7.07% -> 2.71%.
  # So the honest reading is that most of M2's headroom was the floor's
  # fallback being bad, not the booster being good. The gate now asks the
  # question it was always meant to ask: what does this model buy over the BEST
  # simple predictor? Adopting it costs M3's contenders 0.16 minutes of bar and
  # leaves the milestone 0.71 points of headroom instead of 5.07 — which is the
  # honest number to build a bake-off against, and the expensive one.
  floor: baseline-group-median-od-fallback
  # WHY 2.00%, RE-ARGUED against the floor above (it is the same number, and
  # that is a conclusion rather than an omission). It is NOT a statistical bar —
  # over 5.95M test rows even 0.5% is significant. It is a MAINTENANCE-COST bar:
  # 2% of 3.3518 min is ~4.0 seconds of mean error, and a model whose whole
  # advantage over a two-level `GROUP BY` is four seconds does not earn a
  # booster to serve, a registry entry to version, and a rollback path to
  # rehearse. Below this line, ship the lookup table. The absolute cost of
  # ownership did not change when the floor got stronger, so the percentage
  # that expresses it did not either — what changed is the headroom, which is
  # now +2.71% observed against a 2.00% bar (1.35x, not 3.5x). DR-06 §2 forbids
  # quoting +7.07% as headroom anywhere in M3; that number described a
  # comparison against a floor the program has since improved on.
  # LOWERING this is a PO fork. Raising it is the MLE's to argue — and would
  # today disqualify the model that is serving, which is an argument in itself.
  min_improvement_pct: 2.0
  # The second condition, and it can refuse a model the margin would admit:
  # KPI-09 is a mean over ~6M rows, KPI-10 is what one rider experiences. A
  # challenger that improves the average while quoting more riders wrongly has
  # optimised what we report and degraded what we promise — and only the second
  # of those is on M5's SLO.
  require_no_kpi10_regression: true
  # THE INCUMBENT CONDITION (M3-S1, F-011) has no knob and never will. The floor
  # asks "is a booster worth serving at all"; only the model that IS serving can
  # answer "is this one better than what riders already get", and a challenger
  # 4% worse than the champion can clear a floor bar the champion cleared by 7%.
  # It is unconditional rather than configurable for the same reason the feature
  # EXCLUSIONS live in code: a switch that can break an invariant is a trapdoor,
  # not a knob. When the alias is unset there is simply no incumbent to consult,
  # and `registry.promote` refuses to move an alias whose current version the
  # decision did not read — so "no incumbent" cannot be arranged by omission.

# ---------------------------------------------------------------- registry ---
registry:
  # One registered model for the ETA service; contenders are VERSIONS of it, not
  # models of their own. M3's tuned challenger and M7's retrains all land here,
  # so the alias below is the single thing M5's deployment resolves.
  model_name: "nyc-taxi-eta"
  # Serving resolves `models:/nyc-taxi-eta@champion`. An alias and not a stage:
  # MLflow 3 deprecated stages, and an alias is a pointer a rollback can move
  # back in one call.
  champion_alias: "champion"

# ------------------------------------------------------------------ mlflow ---
mlflow:
  # The tracking server's host route (CLAUDE.md port family: 5000 <- 30500).
  # .env's MLFLOW_TRACKING_URI wins when present; this is the checked-in default
  # so a fresh clone has a working value that is not a secret.
  tracking_uri: "http://localhost:5000"
  # Clients talk to MinIO DIRECTLY (infra/helm/mlflow/values.yaml:
  # proxiedArtifactStorage false), so the CLIENT needs the S3 endpoint too —
  # gotcha #5, which is a 404-on-artifacts and not a login error. In-cluster
  # callers (M4's Flyte tasks) override this with the cluster DNS name.
  s3_endpoint_url: "http://localhost:9000"
  # Namespaced from the first run so gotcha #17 (study/experiment collisions)
  # never has a chance to bite.
  experiment: "m2-modeling"
