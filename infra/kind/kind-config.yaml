# kind cluster: 1 control-plane + 2 workers. Pins observed at M0 go to CLAUDE.md.
#
# The node image is pinned by digest ON PURPOSE (MLOps charter refuses unpinned
# versions). It is identical to kind 0.32.0's built-in default — confirmed at
# M0-S2 from a real create (`Ensuring node image (kindest/node:v1.36.1)` and
# `docker inspect mlops-taxi-control-plane` → the same digest). Writing it down
# means a future `kind` upgrade changes the Kubernetes version only when we say
# so, in a diff, instead of silently on somebody's laptop.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mlops-taxi
nodes:
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    # Host access. kind publishes these at CREATE time only — adding a row here
    # means the cluster must be re-created (cluster-down + cluster-up), which is
    # cheap and is exactly why the recipe, not a port-forward, owns this.
    # containerPort = the NodePort the Service claims; hostPort = the CLAUDE.md
    # port family, so a human on Windows opens the documented URL. The port
    # pre-check parses every hostPort below (scripts/port_precheck.sh).
    extraPortMappings:
      - containerPort: 80
        hostPort: 8081            # KServe ingress (M5)
      - containerPort: 443
        hostPort: 8443
      - containerPort: 30500      # Service mlflow-nodeport (infra/manifests/)
        hostPort: 5000            # MLflow UI — the M0 gate's "Show:" artifact
      - containerPort: 30900      # Service minio (chart: service.nodePort)
        hostPort: 9000            # MinIO S3 API
      - containerPort: 30901      # Service minio-console (chart: consoleService.nodePort)
        hostPort: 9001            # MinIO console
      - containerPort: 30300      # Service metabase (infra/manifests/metabase.yaml)
        hostPort: 3030            # Metabase — the M1 gate's "Show:" artifact
  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
# D-001 DECIDED 2026-08-18 (M4-S3): `kind load docker-image`, not the local
# registry pattern — see docker/DECISION-D001-image-delivery.md for both options
# with their honest costs. The short reason lives here because this is the file
# the alternative would have edited: `containerdConfigPatches` is read only at
# cluster-CREATE, so adopting it means delete+create, and this cluster's PVCs hold
# the only copy of the MLflow registry, MinIO's artifacts, the Metabase app-db and
# both Optuna studies. The registry pattern is the better END-STATE and lands at
# the next PO-sanctioned rebuild — the same event that owes Flyte a declared 8080
# hostPort (M4-S2). Until then: `make image-load`, which reads the result back off
# every node with crictl.
