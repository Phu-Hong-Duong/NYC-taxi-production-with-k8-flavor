# The champion on the wire (M5-S2) — one InferenceService, KServe Standard mode.
#
# THE ONE FIELD THIS FILE DOES NOT CARRY IS `storageUri`, AND THAT IS THE POINT.
# What serves is `models:/nyc-taxi-eta@champion`, an ALIAS — a pointer designed
# to move (F-022's decision, the same reasoning one layer up). The S3 path of
# today's champion is a FACT ABOUT TODAY, and a committed one would be a second
# address for the champion that nothing keeps in step with the registry: the day
# the alias moves, this file would still apply cleanly and serve the model that
# used to be champion, with no error anywhere. So `scripts/deploy_champion.sh`
# resolves the alias at deploy time and renders the value in; the placeholder
# below is deliberately not a valid URI so an accidental `kubectl apply -f` of
# this file fails instead of half-working.
#
# WHY THE RESOLUTION IS TWO HOPS AND NOT ONE — F-009, landing here (option b).
# The registry version's `source` is `runs:/<run>/model`, but MLflow 3 writes a
# logged model's artifacts to `<experiment>/models/m-<id>/artifacts`. Reading
# `source` and handing it to KServe would point the storage-initializer at
# `s3://mlflow-artifacts/6/<run>/artifacts/model`, which exists as a prefix with
# NOTHING UNDER IT — the download would "succeed" with an empty directory and
# mlserver would fail on a missing MLmodel, i.e. exactly the artifact-shaped
# error F-009 says blames the wrong thing. The deploy resolves alias -> logged
# model -> `artifact_location`, in one place, and prints it.
#
# `deploymentMode: RawDeployment` is stamped here as well as configured
# cluster-wide (infra/helm/kserve/values.yaml). Belt and braces on purpose: the
# cluster default is a ConfigMap somebody could change, and an InferenceService
# that silently became Serverless would ask for a Knative control plane this
# cluster does not have and would sit Unknown with a message about revisions.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: nyc-taxi-eta
  namespace: serving
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
  labels:
    app.kubernetes.io/part-of: crosstown-eta
spec:
  predictor:
    # The identity the storage-initializer reads MinIO as. Read-only, created by
    # the MinIO chart's user Job (infra/helm/minio/values.yaml) — a leaked
    # serving credential must not be able to write the registry's artifacts,
    # which is the same argument that gave Flyte its own bucket and identity.
    serviceAccountName: taxi-serving
    # One replica: M5 serves one model on one laptop and says so. M5-S4 kills
    # this pod under load on purpose, so "how long until a replacement answers"
    # is a number this milestone measures rather than a property it claims.
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: mlflow
      runtime: taxi-mlserver
      storageUri: RESOLVED-AT-DEPLOY-TIME-FROM-THE-CHAMPION-ALIAS
      env:
        # The REGISTRY version, carried onto the wire. mlserver stamps
        # `model_version` on every inference response, so with this set the
        # answer to "which model produced this number?" travels WITH the number
        # instead of being looked up afterwards from something that may since
        # have changed. Rendered from the same resolution as storageUri — one
        # read of the alias, two fields — so the two can never disagree about
        # which champion this pod is.
        - name: MLSERVER_MODEL_VERSION
          value: CHAMPION-VERSION-RESOLVED-AT-DEPLOY-TIME
      # THE CPU REQUEST WAS 200m UNTIL M6-S2, AND IT WAS WRONG BY ~6.5x.
      # M5-S4 measured this container using **1.31 cores** across the load shape
      # the SLO is written against (4 req/s, 60 s, concurrency 8), and 0.326
      # core-seconds per request. M5 deliberately did not change it — editing a
      # deployed workload's resources is a change to what is on the wire, and
      # that story was a measurement — so the recommendation was routed to M6,
      # which is the milestone those refusals were routed TO (M6 law 2).
      #
      # WHY 1500m AND NOT 1308m, AND NOT 2. A request is not a cap: it is what
      # the SCHEDULER reserves and what sets the container's CPU weight under
      # contention. So it should be close to real usage BY DESIGN — but not equal
      # to a measured mean, which is under-reserved half the time by
      # construction. 1500m is the measured mean plus ~15%, which covers the
      # per-request variance visible in this service's bimodal latency. It stays
      # BELOW the 2-core limit on purpose: request == limit would make the pod
      # Guaranteed and reserve the whole saturation ceiling (~6 req/s) for load
      # the SLO does not promise to serve, on a node with 20 allocatable cores
      # where nothing needs protecting from this pod yet.
      #
      # WHAT IT DOES NOT DO, PREDICTED IN WRITING BEFORE THE CHANGE (see
      # docs/slo_serving.md §7): it does not reduce CFS throttling, because
      # throttling is the LIMIT's doing and the limit is not moving; and it should
      # not move p95 on an uncontended node. The before/after `make load` records
      # are in automation/runs/m6-slo/ and the measurement is the point — if p95
      # moved materially, that is a finding, not a footnote.
      #
      # The memory request is deliberately UNCHANGED at 1Gi (observed peak 236
      # MiB, i.e. over-reserved ~4x) so that the before/after comparison has one
      # cause. It is noted in the SLO document as a known, un-actioned number.
      resources:
        requests:
          cpu: 1500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 3Gi
