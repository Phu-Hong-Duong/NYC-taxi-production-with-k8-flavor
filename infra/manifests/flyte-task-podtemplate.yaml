# flyte-task-podtemplate.yaml — the defaults every Flyte TASK POD inherits (M4-S4).
#
# WHAT PROBLEM THIS SOLVES, because the symptom points somewhere else entirely.
# A Flyte 2 task pod runs the SDK's own runtime, and that runtime builds its
# storage client from `flyte.storage.S3.auto()` — i.e. from ITS OWN environment
# (FLYTE_AWS_ENDPOINT / FLYTE_AWS_ACCESS_KEY_ID / FLYTE_AWS_SECRET_ACCESS_KEY).
# Three other places in this program configure MinIO for Flyte and NONE of them
# reaches that process: the flyte-binary ConfigMap configures the SERVER, the
# copilot Secret configures the co-pilot SIDECAR, and the values overlay
# configures helm. So with nothing here a task pod pulls its image, starts, runs
# our code to completion, and then dies uploading its outputs against
# `http://169.254.169.254/latest/api/token` — the EC2 instance-metadata address,
# reached because obstore fell through to the default AWS credential chain.
# Observed exactly that way on 2026-08-18 (run rb2pzmghlfd4d6mxr8kl): the task
# was fine, the write had no credentials.
#
# WHY A PodTemplate RATHER THAN PUTTING IT IN THE TASK CODE. `flyte.TaskEnvironment`
# can carry env vars and secrets, and that would work — for the environment that
# remembered to declare it. How a pod reaches the blob store is a property of THIS
# CLUSTER, not of any task, and `pipelines/flyte/workflows.py` should no more
# carry a MinIO endpoint than `taxi_mlops` should import an orchestrator. Flyte's
# k8s plugin reads a PodTemplate by name (`plugins.k8s.default-pod-template-name`,
# set in infra/helm/flyte/values.yaml) and merges it into every task pod it
# builds, so a task defined tomorrow inherits this without knowing it exists.
#
# THE CONTAINER MUST BE NAMED `default`. That is the flyte k8s plugin's contract:
# a container named `default` supplies DEFAULTS merged into the primary container
# whatever that container ends up being called (task pods are named after their
# action, e.g. `rb2pzmghlfd4d6mxr8kl-a0-0`). A container named anything else is
# merged as a literal sidecar of that name, which is not what is wanted here.
#
# THE ENDPOINT IS THE IN-CLUSTER NAME AND MUST STAY THAT WAY. A pod cannot reach
# `localhost:9000` — that is its own loopback. This is the OTHER half of the split
# horizon F-023 named: the same MinIO is `minio.platform.svc.cluster.local:9000`
# from in here and `localhost:9000` from the host, and both names are configured,
# each on the side that can resolve it. See the `signedUrl.stowConfigOverride`
# block in infra/helm/flyte/values.yaml for the host side.
#
# TWINS: `FLYTE_AWS_ENDPOINT` and `FLYTE_AWS_ACCESS_KEY_ID` below must equal
# `configuration.storage.providerConfig.s3.endpoint` and `.accessKey` in
# infra/helm/flyte/values.yaml — the server and the tasks writing to two different
# buckets or as two different users is a failure that shows up as a 403 hours
# downstream. tests/unit/test_platform_scripts.py fails if they drift, the same
# way it pins the hostPort/nodePort pairs.
#
# NO SECRET IS IN THIS FILE. The secret half arrives by reference from
# `flyte-task-storage`, which scripts/platform_secrets.sh converges out of .env.
apiVersion: v1
kind: PodTemplate
metadata:
  name: flyte-task-defaults
  namespace: flyte
template:
  spec:
    volumes:
      - name: taxi-data
        persistentVolumeClaim:
          claimName: taxi-data
    containers:
      - name: default
        # Required by the PodTemplate schema and never used: the API server
        # rejects a container without an `image`, but the k8s plugin overwrites
        # this field with the task's own image when it merges. Named to say so —
        # a plausible-looking image here would be a trap for the next reader, who
        # would reasonably assume tasks run it.
        image: unused-placeholder-the-task-image-replaces-this
        # THE TASK IMAGE IS LOCAL AND MUST NEVER BE PULLED. D-001 decided that
        # images reach the nodes by `kind load` (a local registry needs a
        # kind-config edit, i.e. a rebuild, which the statefulness law forbids),
        # so `taxi-mlops-pipeline:<sha>` exists in every node's containerd and
        # nowhere else. Flyte does not set a pull policy on task containers, and
        # kubernetes' default for a non-`:latest` tag would be IfNotPresent — but
        # the default only applies when the field is EMPTY, and observed here it
        # was not: the first pipeline run died on
        # `ErrImagePull … docker.io/library/taxi-mlops-pipeline:9613543: pull
        # access denied`, i.e. it went looking for our private tag on Docker Hub.
        # `IfNotPresent` rather than `Never` deliberately: both refuse to invent
        # bytes, and IfNotPresent leaves the door open for the registry pattern
        # D-001 deferred to the next sanctioned rebuild, without another edit here.
        imagePullPolicy: IfNotPresent
        env:
          - name: FLYTE_AWS_ENDPOINT
            value: "http://minio.platform.svc.cluster.local:9000"
          - name: FLYTE_AWS_ACCESS_KEY_ID
            value: "flyte"
          # --- how a task reaches MLflow (M4-S4) --------------------------------
          # `taxi_mlops.training.tracking.configure()` takes an already-exported
          # environment variable over the config file, and configs/train.yaml says
          # so in its own comment ("in-cluster callers (M4's Flyte tasks) override
          # this"). This is that override. The checked-in defaults are the HOST
          # routes (localhost:5000 / localhost:9000), which inside a pod are the
          # pod's own loopback — the same split horizon as F-023, one layer up.
          # The image carries no `.env` (M4-S3), so without these the train stage
          # would fall back to a config default that cannot resolve.
          - name: MLFLOW_TRACKING_URI
            value: "http://mlflow.mlflow.svc.cluster.local:5000"
          # The tracking server does NOT proxy artifacts
          # (infra/helm/mlflow/values.yaml: proxiedArtifactStorage false), so the
          # CLIENT writes to MinIO itself — gotcha #5. A task that has the tracking
          # URI and not this one logs metrics happily and 404s on the model.
          - name: MLFLOW_S3_ENDPOINT_URL
            value: "http://minio.platform.svc.cluster.local:9000"
          # boto3 requires a region even when the endpoint is MinIO and the region
          # means nothing. `taxi_mlops.training.tracking` treats it as mandatory
          # for that reason, so it is supplied here rather than left to a default
          # that does not exist inside a pod. Matches the `region` the flyte-binary
          # storage config uses, because they address the same server.
          - name: AWS_DEFAULT_REGION
            value: "us-east-1"
        envFrom:
          # TWO identities in one pod, deliberately. `flyte-task-storage` is
          # Flyte's own MinIO user, which may touch `flyte-data` (task inputs and
          # outputs); `flyte-task-mlflow` is MLflow's, which may touch
          # `mlflow-artifacts` (models and their signatures). They were separated
          # at M4-S2 so a leaked orchestrator credential could not reach the
          # registry's artifacts, and merging them here to save a Secret would
          # quietly undo that.
          - secretRef:
              name: flyte-task-storage
          - secretRef:
              name: flyte-task-mlflow
        # --- the data, mounted by SUBPATH and not at `/app/data` ----------------
        # Three mounts rather than one, and the reason is a trap M4-S3 already
        # paid for once (gotcha #58). `/app/data` in the image is not empty: it
        # holds `data/reference/` — zone centroids, the TLC lookup, the pinned
        # shapefile, the holiday table — the committed lookup layer
        # `taxi_mlops.features` reads. Mounting the PVC at `/app/data` would MASK
        # all of it, producing an image that imports every module perfectly and
        # cannot build a feature. Mounting the three data trees individually
        # leaves `data/reference` as the image shipped it, which is also the only
        # way it stays pinned by git.
        volumeMounts:
          - name: taxi-data
            mountPath: /app/data/raw
            subPath: raw
          - name: taxi-data
            mountPath: /app/data/processed
            subPath: processed
          - name: taxi-data
            mountPath: /app/data/rejected
            subPath: rejected
