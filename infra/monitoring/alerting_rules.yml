# alerting_rules.yml — the serving alert rules (M6-S2).
#
# WHAT THIS FILE IS. A plain Prometheus rules file: `groups` -> `rules`, the
# format `promtool check rules` reads. It is CHECKED IN and PROVISIONED —
# `scripts/render_alert_rules.py` nests it under the chart's
# `serverFiles.alerting_rules.yml` at deploy time and `scripts/deploy_monitoring.sh`
# passes the result to helm. Nothing here is ever clicked into a UI, for the same
# reason M1-S5's Metabase boards are checked-in JSON: a rule that exists only in
# a running process cannot be reviewed in a PR and cannot be rebuilt after
# `make destroy`.
#
# EVERY THRESHOLD IN THIS FILE IS ARGUED IN docs/slo_serving.md AND THE ARGUMENT
# IS NOT "THIS IS WHAT WE MEASURED". Gotchas #63/#74 in bar-form: a bar set equal
# to the number just observed is a bar that reports the past. Each rule below
# carries a one-line `why` pointing at the SLO section that owns its number, and
# the numbers themselves are derived from MEASURED HEADROOM — the rate at which
# the service is observed to degrade — not from the rate at which it is observed
# to work.
#
# THE A-IDS ARE THE M5 PRR'S BOX 3, AND TWO OF THE SEVEN ARE DELIBERATELY ABSENT
# FROM THIS FILE (F-035). They are named in `docs/slo_serving.md` §6 with their
# reason and their landing:
#   * A-3's CLIENT half — the count of `UncoveredDateError` refusals (F-019).
#     The refusal is raised in the CLIENT before a request is built, so it moves
#     no server counter. Measured this session: a past-horizon `make quote`
#     (exit 2) left `rest_server_requests_total{path=~".*infer"}` at 22 -> 22.
#     The rule below covers the SERVER half (a malformed or schema-invalid body
#     that reaches mlserver, F-030's class); the client half needs a metric
#     source this stack has not got, and its landing is M7's pushgateway.
#   * A-4 — served version != registry `@champion`. No mlserver metric carries
#     the model version (`version="None"`, M6-S1/F-034) and MLflow exports no
#     Prometheus metrics at all, so the comparison has no two series to make.
#     It lives as a live CHECK (`verify-m5` §2, `verify-m6`), not as an alert.
#
# WHY SO MANY OF THESE ARE MEASURED AT THE EDGE AND NOT AT THE MODEL.
# When the predictor dies its /metrics endpoint dies with it — the series does
# not go to zero, it STOPS EXISTING. An error-rate alert written against
# mlserver's own counters therefore cannot fire for the outage that matters most.
# ingress-nginx is a different process, on a different node, that survives the
# predictor: it is the only witness present for the failure it is meant to
# report. Same reasoning as M4-S4's "two witnesses must agree", one layer down.

groups:
  - name: crosstown-serving
    # 15s, matching `server.global.evaluation_interval`. Every `for:` below is
    # therefore honoured to within one evaluation.
    interval: 15s
    rules:
      # --- A-1 · latency -----------------------------------------------------
      # SLO-L1: 95% of inference requests complete within 250 ms server-side.
      #
      # THIS IS NOT A `histogram_quantile` AND THAT IS THE POINT. Measured
      # 2026-08-19: over the SLO's own load shape the client (which times the
      # whole round trip, i.e. strictly MORE than the server does) reported a p95
      # of 84.4 ms while `histogram_quantile(0.95, ...)` on the same window
      # reported 111.6 ms. A quantile estimated from a superset cannot legally
      # exceed one estimated from a subset, so the 111.6 ms is an artefact:
      # mlserver's default buckets jump 0.1 -> 0.25, and this service's tail
      # lives inside that 150 ms-wide gap, so the estimate is linear
      # interpolation across a bucket that holds 13 of 259 observations.
      # The SLO's number is therefore chosen to BE a bucket edge (le="0.25"),
      # which makes this expression an exact count of how many requests were
      # slower than the target — no interpolation anywhere.
      - alert: PredictorLatencySLOBurning
        expr: |
          (
            sum(rate(rest_server_request_duration_seconds_count{job="kserve-predictors", path=~".*infer", status_code="200"}[5m]))
            -
            sum(rate(rest_server_request_duration_seconds_bucket{job="kserve-predictors", path=~".*infer", status_code="200", le="0.25"}[5m]))
          )
          /
          sum(rate(rest_server_request_duration_seconds_count{job="kserve-predictors", path=~".*infer", status_code="200"}[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
          signal: A-1
          slo: SLO-L1
        annotations:
          summary: "More than 5% of quotes are slower than the 250 ms SLO target"
          why: >-
            docs/slo_serving.md §3 SLO-L1. 250 ms is a bucket EDGE, so this is a
            count and not an interpolation. Observed at the SLO's stated shape
            (4 req/s, 60 s, concurrency 8, hazard mix): 258 of 259 infers within
            250 ms, i.e. 0.4% beyond it against a 5% budget.
          sustain: >-
            for 5m, because a single slow scrape window is what a cold model load
            or one host hiccup looks like, and neither is a user-visible outage.
          instrument_limit: >-
            F-043, measured at M6-S5 and argued in docs/slo_serving.md §2.2:
            THIS RULE READS AN IN-POD EXPORTER, AND ABOVE ~90% CPU THE POD
            CANNOT RELIABLY REPORT ON ITSELF. Under a throttled fraction of
            0.9996 the predictor's /metrics went from 4 ms to 4.613 s with one
            scrape failing outright (the idle shadow, same job, stayed at
            0.004 s) — which made this alert FIRE at T+349.3 s and then CLEAR
            ITSELF at T+514.3 s while the load was still running. A-1 going
            inactive during a saturation event carries no information. The
            instruments that hold are node-side (A-6, the kubelet's cAdvisor —
            it is what measured the 0.9996) and edge-side (A-2, ingress-nginx).

      # --- A-2 · 5xx at the edge --------------------------------------------
      # SLO-A1: 99.9% of requests to the quote route are answered non-5xx.
      #
      # THE THRESHOLD IS SET SO THAT ONE SELF-HEAL CANNOT PAGE, AND THAT IS AN
      # ARITHMETIC CLAIM, NOT A PREFERENCE. A killed predictor costs 14.53 s
      # (M5-S4), a route roll 15.0 s (M6-S1/F-033), a stop/start 18.24 s
      # (M5-S5). At the SLO's stated 4 req/s, the worst of those is 73 failed
      # requests inside a 5-minute rate window carrying ~1200 — 6.1%. A 5%
      # threshold would page for a system that healed itself in eighteen
      # seconds; 10% cannot be reached by any single recovery this program has
      # ever measured, and is reached immediately by a service that is simply
      # down. Sustained 5m on top (the prior-art ADOPT), so the 15-second blip
      # also has to still be there five minutes later.
      - alert: ServingEdge5xxRateHigh
        expr: |
          sum(rate(nginx_ingress_controller_requests{namespace="serving", ingress="nyc-taxi-eta", status=~"5.."}[5m]))
          /
          sum(rate(nginx_ingress_controller_requests{namespace="serving", ingress="nyc-taxi-eta"}[5m]))
          > 0.10
        for: 5m
        labels:
          severity: critical
          signal: A-2
          slo: SLO-A1
        annotations:
          summary: "More than 10% of quote-route requests are 5xx at the edge, sustained"
          why: >-
            docs/slo_serving.md §3 SLO-A1. Measured at the EDGE because when the
            predictor dies its exporter dies with it — mlserver cannot report
            its own absence.
          blind_spot: >-
            A ratio has no value when nobody is asking. This rule is blind on an
            idle service, which is exactly why A-5 exists and does not need
            traffic to fire.

      # --- A-3 · request rejections (the SERVER half; see the header) --------
      - alert: PredictorRequestRejectionRateHigh
        expr: |
          sum(rate(rest_server_requests_total{job="kserve-predictors", path=~".*infer", status_code=~"4.."}[5m]))
          /
          sum(rate(rest_server_requests_total{job="kserve-predictors", path=~".*infer"}[5m]))
          > 0.01
        for: 2m
        labels:
          severity: warning
          signal: A-3
          slo: SLO-R1
        annotations:
          summary: "More than 1% of inference requests are being REJECTED as malformed (4xx)"
          why: >-
            docs/slo_serving.md §3 SLO-R1. A 4xx here is the REQUEST's fault and
            is a working guard, not an outage — which is why it is separated from
            SLO-A1's error budget entirely rather than folded into it. F-030 is
            the worked example: ~1% of all riders got a 422 for a whole milestone
            because the client serialised NaN, and nothing anywhere said so.
          sustain: >-
            for 2m, not 5m. A malformed body is a client-version or encoding
            defect; it does not self-heal, so the sustain window only has to
            outlast a probe or a single bad caller.

      # --- A-5 · the replica ------------------------------------------------
      # This is the rule that fires with NO traffic at all, which is why the
      # error-ratio rules are allowed to be blind on an idle service.
      - alert: PredictorNoAvailableReplica
        expr: |
          kube_deployment_status_replicas_available{namespace="serving", deployment=~".*-predictor"} < 1
        for: 2m
        labels:
          severity: critical
          signal: A-5
        annotations:
          summary: "The predictor Deployment has had no available replica for 2 minutes"
          why: >-
            docs/slo_serving.md §3 SLO-A1. 2m is 6.6x the longest healthy
            recovery this program has ever measured (18.24 s, the stop/start
            rehearsal), so a normal replacement cannot page and a pod that
            cannot come back does. One replica, no canary: this alert IS the
            outage.
          sustain: >-
            for 2m, not 5m. This is the rule that fires with NO traffic, so it is
            the only witness to an outage nobody is currently experiencing —
            waiting five minutes to say "there is no server" is four minutes of
            silence bought for nothing. 2m is chosen against the measured
            recoveries, not against the ADOPTed default.

      - alert: PredictorRestartFlapping
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace="serving", container="kserve-container"}[15m]) > 2
        for: 0m
        labels:
          severity: warning
          signal: A-5
        annotations:
          summary: "The predictor container has restarted more than twice in 15 minutes"
          why: >-
            docs/slo_serving.md §3. Steady state is 0 restarts (observed since
            M5-S2). Two is a coincidence; three inside a quarter hour is a loop,
            and each one costs a full outage because there is one replica.
          sustain: >-
            for 0m deliberately — `increase(...[15m])` IS the window. Adding a
            `for:` on top would mean a flapping pod has to keep flapping after
            it has already been detected flapping.

      # --- A-6 · CPU throttling ---------------------------------------------
      # GOTCHA #74 AS A RULE. Saturation shows up as latency, never as failure,
      # so no health check and no error-rate alert can see it.
      #
      # THE THRESHOLD IS THE INTERESTING PART AND IT COULD NOT HAVE BEEN GUESSED.
      # This container is throttled at EVERY rate it has ever been measured at,
      # including ones where it is demonstrably healthy. M5-S4's ramp, fraction
      # of CFS periods throttled: 0.23 at 2 req/s (p50 18.5 ms) · 0.51 at
      # 4 req/s (p50 19.1 ms) · 0.79 at 6 req/s (p50 18.1 ms) · ~1.00 at
      # 8 req/s (p50 115.5 ms, 6.4x worse). So "any throttling" fires on a
      # healthy service, and the bar has to come from where throttling starts to
      # HURT — between the last harmless observation (0.79) and the first
      # harmful one (~1.00). 0.90, sustained 10m.
      - alert: PredictorCpuThrottledSustained
        expr: |
          sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace="serving", container="kserve-container"}[5m]))
          /
          sum by (pod) (rate(container_cpu_cfs_periods_total{namespace="serving", container="kserve-container"}[5m]))
          > 0.90
        for: 10m
        labels:
          severity: warning
          signal: A-6
        annotations:
          summary: "The predictor is spending >90% of CFS periods throttled — it is at its CPU ceiling"
          why: >-
            docs/slo_serving.md §3 SLO-L1's capacity note. At 0.79 the p50 is
            unchanged; at ~1.00 it is 6.4x worse with ZERO errors. This is the
            only signal that can tell those apart.
          sustain: >-
            for 10m, because the honest response is "add a replica or raise the
            limit", which nobody should be paged for at 3am over a two-minute
            burst.

      # --- A-7 · the storage initializer -------------------------------------
      - alert: PredictorStorageInitializerNotReady
        expr: |
          kube_pod_init_container_status_ready{namespace="serving", container="storage-initializer"} == 0
        for: 3m
        labels:
          severity: critical
          signal: A-7
        annotations:
          summary: "A predictor pod's storage-initializer has not become ready for 3 minutes"
          why: >-
            docs/slo_serving.md §3 SLO-A1. Two real classes land here and BOTH
            look like "the model is broken" when they are not: MinIO's built-in
            `readonly` policy omitting s3:ListBucket (a 403 on HeadBucket,
            M5-S2), and F-009's empty-prefix download that SUCCEEDS and leaves
            mlserver with no MLmodel. A healthy init takes seconds; 3m is a
            failure. MEASURED 2026-08-19 (Gameday 1, scenario 2 — the first of
            those two classes injected for real): this alert fires SIXTY SECONDS
            AFTER A-5, not before it. Both went pending together at T+30.1s;
            A-5 fired at T+150.2s on its 2m sustain and this one at T+210.2s on
            its 3m. The sentence that used to sit here claimed the opposite and
            was never anything but an inference from "a pod that never
            initialises never had a replica to lose" — true about the CAUSE,
            silent about the two `for:` windows underneath.
          sustain: >-
            for 3m. What the pair actually gives is a distinguishable SIGNATURE
            rather than an ordering: A-5 alone is "the replica is gone" (a kill,
            a stop, an eviction), A-5 THEN A-7 sixty seconds later is "the
            replacement cannot fetch its model" — the credential/prefix class.
            Gameday 1 got the second shape exactly and no other alert moved.
            Making A-7 arrive first would mean shortening it to ~1m, which is a
            threshold change argued from a number just measured; it is written
            up in docs/gameday_m6.md §3.1 as a recommendation and deliberately
            NOT taken here.

  # ==========================================================================
  # M7-S3 · THE DRIFT AND CLIENT-SIDE SIGNALS
  #
  # Everything below reads the PUSHGATEWAY, not a scraped service, and that
  # changes one thing about how the rules are written: a pushed metric is a
  # LAST VALUE ON A BULLETIN BOARD, not a sample in a window. It persists after
  # its producer dies. So there is no `rate()` on a drift value anywhere here,
  # F-041's empty-window mechanism does not apply to these sustains, and every
  # value-reading rule in this block is paired with a freshness condition or a
  # freshness rule — because "the number is present and fine" and "nobody has
  # produced a number since March" are otherwise the same picture. That is
  # gotcha #78's empty-panel disease inverted: not a blank rectangle that looks
  # like calm, but a stale number that looks like health.
  #
  # Every threshold below is argued in docs/slo_serving.md §8, which was written
  # from the HEADROOM LEG (the two held-out 2019 months, whose verdict is
  # already PROMOTE) BEFORE any 2020 month was compared — M7 law 4, with the
  # order of work checkable from the records' own timestamps.
  # ==========================================================================

  - name: crosstown-drift
    interval: 15s
    rules:
      # --- A-8 · input drift -------------------------------------------------
      # SLO-D1: fewer than two of the five monitored INPUT columns at PSI >= 0.10.
      #
      # THE `count(...)` SHAPE IS THE RULE, NOT AN OPTIMISATION. The bar 0.10
      # appears exactly once, inside the selector, and the alert counts how many
      # columns are past it. The alternative — having the drift job compute a
      # "drifted share" and push that — would put the threshold in TWO places
      # (the job and the doc, F-013's twin problem) and would make the pushed
      # number un-reinterpretable after the fact. The job pushes raw PSI per
      # column and does not judge; a test asserts that no bar-shaped constant
      # exists anywhere under src/taxi_mlops/monitoring/.
      #
      # THE TARGET IS EXCLUDED BY NAME. trip_duration_minutes is monitored and
      # pushed, but it is not an input: inputs steady + target moved means the
      # RELATIONSHIP changed under the model, both moved means the world did,
      # and averaging the two into one share would destroy exactly the
      # distinction that makes the alert actionable.
      - alert: ModelInputDrift
        expr: |
          count by (month) (
            taxi_drift_psi{job="taxi-drift", column!="trip_duration_minutes"} >= 0.10
          ) >= 2
        for: 5m
        labels:
          severity: warning
          signal: A-8
          slo: SLO-D1
        annotations:
          summary: "{{ $value }} monitored input columns are past PSI 0.10 for month {{ $labels.month }}"
          why: >-
            docs/slo_serving.md §8.3. The per-column bar 0.10 is 3.1x the
            highest distance a PROMOTED month sits at (0.0323 — dayofweek in
            July 2019, which is calendar arithmetic: five Mondays) and 7.3x the
            largest behavioural one (0.0137, PULocationID in August 2019). It is
            also the published PSI "investigate" convention, which matters for
            one reason: an on-call who did not write this document already has a
            prior for what 0.10 means, and a house-special 0.037 would be a
            number only its author could interpret. TWO columns rather than one
            because the champion's inputs are strongly correlated
            (hour<->dayofweek, PU<->DO) so a real world event moves several at
            once, while a single column moving alone is more consistent with a
            data-side artefact.
          blind_spot: >-
            One column going catastrophically wrong does NOT page — a vendor
            sending passenger_count=0 for every trip moves one column to a huge
            PSI and this stays silent. Deliberate: it is visible on the board
            and in the monthly memo, and A-9 needs no column to move at all. If
            a single-column catastrophe ever happens here, §8.3's paragraph was
            wrong and the split gets re-argued rather than the bar walked.
          sustain: >-
            for 5m, and it is NOT F-041's mechanism. These are last-value gauges
            from a bulletin board, not a rate over a window that is empty at
            t=0, so the sustain's only job is to outlive a failed scrape of the
            gateway or a half-written push. 5m is 20 evaluations at 15s.
          runbook: >-
            A drift alert is a request for a DECISION (retrain, re-scope, or
            accept), not a fault report. Read the per-column PSI and
            taxi_drift_unseen_share first: an unseen-category spike is a
            data-side event, a re-weighting is a world-side one. Nothing
            auto-retrains and nothing here can move @champion (M7 law 3).

      # --- A-9 · volume collapse ---------------------------------------------
      # SLO-D2: the scoring month holds at least half the reference's trips/day.
      #
      # THIS IS NOT A REFINEMENT OF A-8, IT IS THE MARGINAL A-8 CANNOT SEE.
      # PSI is a distance between SHARES. Halve every count and PSI is exactly
      # zero. A city that stops moving while keeping the same mix of trips is
      # invisible to A-8 and obvious here — F-045 (M7-S1) from the monitoring
      # side.
      - alert: ScoringVolumeCollapse
        expr: |
          taxi_drift_volume_ratio{job="taxi-drift"} < 0.50
        for: 5m
        labels:
          severity: warning
          signal: A-9
          slo: SLO-D2
        annotations:
          summary: "Month {{ $labels.month }} holds {{ $value | humanizePercentage }} of the reference's trips per day"
          why: >-
            docs/slo_serving.md §8.4. The lowest ordinary observation in this
            repository is 0.7899 (August 2019 against the train reference), so
            0.50 sits 29 percentage points below the quietest month a promoted
            champion was ever judged on. A summer dip is ~20%; halving is not a
            dip. A model quoting confidently into a market that has lost half
            its trips is quoting into a different market.
          sustain: >-
            for 5m, for A-8's reason: a last-value gauge, not a rate.

      # --- A-10 · the drift job stopped running ------------------------------
      # SLO-D3: a drift number older than 40 days is not a drift number.
      - alert: DriftMetricsStale
        expr: |
          (time() - max by (month) (taxi_drift_last_run_timestamp_seconds{job="taxi-drift"})) > 3456000
        labels:
          severity: warning
          signal: A-10
          slo: SLO-D3
        annotations:
          summary: "The drift job has not reported for month {{ $labels.month }} in over 40 days"
          why: >-
            docs/slo_serving.md §8.5. 3456000 seconds is 40 days: the cadence is
            monthly, so a month plus a week plus a weekend. One late run does
            not page; a stopped job does. The gateway has no expiry — a pushed
            metric persists until it is overwritten — so without this rule
            "drift is fine" and "the drift job died in March" render
            identically. The producer cannot be trusted to notice its own
            absence, which is why the guard is here AND in a type:
            push_metrics() REFUSES a payload with no
            taxi_drift_last_run_timestamp_seconds.
          sustain: >-
            none, deliberately. The condition already contains a 40-day
            duration; adding a `for:` would mean 40 days plus five minutes,
            which reads like care and is noise.
          blind_spot: >-
            A-10 cannot fire on an ABSENT series. `time() - max by (month)(X)`
            over zero series is zero series, not a large number — so a gateway
            that lost its store produces no stale metric, it produces no metric,
            and this rule sits inactive while the board renders empty. That is
            A-11's job, and the two are complements: A-10 catches a job that
            stopped running, A-11 catches a board that stopped existing.

      # --- A-11 · the drift surface itself is gone ---------------------------
      # SLO-D4, and it exists because F-050 measured A-10's blind spot on this
      # machine three times in 24 hours.
      #
      # WHY `absent()` AND NOT A THRESHOLD. There is no number to compare: the
      # failure is that the series does not exist. A pushgateway restart used to
      # empty the store (emptyDir), and every drift panel went blank while every
      # rule stayed inactive — the shape M6-S1 paid for on the Grafana boards
      # (gotcha #78): an empty rendering is what a QUIET system looks like, so
      # nothing may treat "no data" as the good state.
      #
      # THIS RULE IS ONLY HONEST BECAUSE THE GATEWAY NOW HAS A VOLUME. The pair
      # was decided together at the M7->M8 boundary: with an emptyDir this fires
      # on every ordinary host reboot and teaches its reader to ignore it; with
      # the PersistentVolume it fires when somebody DELETED something — a cluster
      # rebuild, a wiped PVC, a namespace removed. Landing (b) without (a) would
      # have been a page for a laptop being switched off.
      - alert: DriftMetricsAbsent
        expr: |
          absent(taxi_drift_last_run_timestamp_seconds{job="taxi-drift"})
        for: 10m
        labels:
          severity: warning
          signal: A-11
          slo: SLO-D4
        annotations:
          summary: "No drift series exist at all — the drift surface is gone, not quiet"
          why: >-
            docs/slo_serving.md §8.5a. The gateway is a bulletin board: a pushed
            metric persists until it is overwritten or the store is lost. A-10
            watches the STAMP and therefore requires the stamp to exist; this
            rule watches the existence. Measured cost of not having it (F-050):
            the store emptied on a host restart on 2026-08-20 and again on
            2026-08-21, and on both occasions every drift rule was inactive and
            every drift panel blank, which is indistinguishable from a month in
            which nothing drifted.
          sustain: >-
            for 10m, and the number is argued from the gateway's own restart
            time rather than from taste. A pod replacement re-serves the same
            series as soon as it is Ready — measured in this repo at ~30s
            (automation/runs/m8-drift/persistence.json) — so 10m is roughly an
            order of magnitude of headroom over the only benign cause. Longer
            (an hour, matching A-10's monthly-cadence logic) would be equally
            defensible against the harm side; 10m is preferred because a wiped
            board is cheap to notice and expensive to leave, and because a drill
            has to be able to watch it fire.
          runbook: >-
            Check the gateway pod and its PVC first
            (`kubectl -n monitoring get pod,pvc | grep pushgateway`). If the
            volume survived and the pod is Ready, the series are gone for a
            reason worth understanding. The one-command repair, once the cause
            is known, is to re-push the real numbers:
            `make drift DRIFT_ARGS="--months 2020-01 2020-02 2020-03 --push"`
            against a port-forwarded gateway. Do NOT silence this by deleting
            the rule — an empty board and a calm world render identically.

      # --- A-3 (client half) · the horizon expired ---------------------------
      # F-035's first landing. See docs/slo_serving.md §6's dated update.
      #
      # WHY `increase(...) > 0` AND NOT A RATE OR A SHARE. This is not a volume
      # problem needing a fleet of clients. One UncoveredDateError means the
      # holiday table's horizon has expired — a fact about the REPOSITORY, not
      # about traffic — and its fix is one command
      # (`make holidays HOLIDAYS_TO=YYYY`). So a single event IS the event, and
      # a threshold above zero would be a decision to serve some refusals
      # quietly.
      - alert: QuoteHorizonRefusals
        expr: |
          increase(taxi_quote_refusals_total{job="taxi-quote-client", reason="uncovered_date"}[1h]) > 0
        for: 1m
        labels:
          severity: warning
          signal: A-3
          slo: SLO-R1
        annotations:
          summary: "A quote was refused as past the holiday-table horizon in the last hour"
          why: >-
            docs/slo_serving.md §6. F-019 chose to REFUSE rather than degrade —
            a wrong quote nobody can see is wrong is worse than a countable
            failure with its fix in the error text — and the cost was that the
            refusal happens in the CLIENT, before a request exists, so no server
            counter moves. Measured at M6-S2: a past-horizon `make quote` left
            the infer counter at 22 -> 22. The client now pushes its own count,
            which is the metric source that did not exist until M7's pushgateway.
          sustain: >-
            for 1m, only to require the value to survive one re-scrape of the
            gateway. The condition itself is already "any refusal in an hour".
          complement: >-
            `verify-m6` still asserts the holiday table's coverage. That catches
            the expiry BEFORE a rider meets it; this catches the rider who
            already did. Neither replaces the other.

      # --- A-4 · served version != registry @champion ------------------------
      # F-035's second landing. The reason it was impossible until now is F-034:
      # NO mlserver metric carries the model version (version="None"), and
      # MLflow exports no Prometheus metrics at all — there were not two series
      # to compare. scripts/push_serving_version.py makes two, by asking the
      # endpoint for one real prediction (the version is on the ANSWER, M5-S2)
      # and the registry for the alias, then pushing both.
      - alert: ServedVersionNotChampion
        expr: |
          (
            taxi_serving_model_version{job="taxi-serving-version"}
            != on() group_left()
            taxi_registry_champion_version{job="taxi-serving-version"}
          )
          and on()
          (time() - taxi_serving_version_last_run_timestamp_seconds{job="taxi-serving-version"} < 1800)
        for: 2m
        labels:
          severity: critical
          signal: A-4
          slo: SLO-A1
        annotations:
          summary: "The endpoint is serving version {{ $value }}, which is not the registry's @champion"
          why: >-
            docs/slo_serving.md §6. F-032's shape: a rollback is THREE moves
            (alias, config line, re-deploy) and nothing enforced the middle one,
            so a half-finished rollback leaves the pointer and the wire
            disagreeing while every InferenceService condition still reads
            Ready — no restart, no event, no probe. Critical because the failure
            is silent by construction.
          sustain: >-
            for 2m, shorter than the ADOPTed 5m default and deliberately so.
            The other rules sustain to avoid paging for a transient — a slow
            scrape window, a self-heal in progress. This condition has no
            transient form: the wire and the registry either agree or they do
            not, and the state they are in is the state somebody left them in.
            The 2m is there only to let a re-deploy's own brief window close
            (M6-S4 measured a rollback's second move at 27.93 s, and a
            re-deploy at 0.5 s), not to wait out noise.
          freshness: >-
            The `and on() (time() - ..._last_run_timestamp_seconds < 1800)` is
            not decoration. A pushed pair persists after its pusher dies and
            agrees with itself forever, so without this clause a dead pusher
            reads as a healthy service. 30 minutes.
          honest_cut: >-
            M7-S3 landed the metric SOURCE, which is what F-035 said was
            missing. What runs the pusher on a cadence lands with M7-S4's
            scheduler. Until then `verify-m5` §2 remains the check that actually
            runs, at every gate, and asks the endpoint directly.
