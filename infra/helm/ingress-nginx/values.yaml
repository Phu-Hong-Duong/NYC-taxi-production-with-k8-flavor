# ingress-nginx — the DECLARED route into this cluster (M5-S1).
#
# Every override below exists because of something about THIS cluster. Nothing
# here is chart-default-with-a-shrug.
#
# WHY NOT THE UPSTREAM `deploy/static/provider/kind` MANIFEST. It selects nodes
# with `ingress-ready=true`, a label kind writes only when the kind config asks
# for it — and ours does not (checked at the M5 kickoff with `grep -n
# "node-labels\|kubeadmConfigPatches" infra/kind/kind-config.yaml`: no matches).
# The kind config is read only at cluster-CREATE, and this cluster is stateful:
# its PVCs are the only copy of the registry, MinIO's artifacts, the Metabase
# app-db and both Optuna studies. So the label is unavailable at a price M5 will
# not pay, and the chart is configured directly instead.
#
# HOW THE ROUTE ACTUALLY WORKS, in one line, because it is two hops and people
# debug the wrong one: kind published `containerPort: 80 -> hostPort: 8081` on
# the CONTROL-PLANE node at create time (infra/kind/kind-config.yaml), so a pod
# that binds port 80 *on that node* is reachable at `localhost:8081` from WSL.
# Hence hostPort + a hostname nodeSelector; a controller that schedules on a
# worker answers nothing and looks exactly like a KServe failure.
controller:
  # The node whose ports the kind config publishes. Derived, not typed: the
  # deploy script builds this from the cluster name in infra/kind/kind-config.yaml
  # and asserts the value below matches (gotcha #52 — the fix that changes a
  # VALUE leaves the hazard; here the script makes the two disagree loudly).
  nodeSelector:
    kubernetes.io/hostname: mlops-taxi-control-plane
  # …and that node carries the standard control-plane taint, so the selector
  # alone would leave the pod Pending forever with a message about taints and
  # nothing about ports.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Equal
      effect: NoSchedule

  hostPort:
    enabled: true
    ports:
      http: 80
      https: 443

  # The route is the hostPort. A NodePort Service would be a SECOND way in with
  # a second port number to keep in the CLAUDE.md port family, and nothing would
  # use it. ClusterIP keeps the in-cluster name for anything that wants it.
  service:
    type: ClusterIP

  # With no LoadBalancer and no published Service there is nothing for the
  # controller to copy into an Ingress's `status.loadBalancer`, and it logs about
  # that on a loop. `localhost` is the honest answer here: that IS where the
  # route answers from, for the human running curl.
  publishService:
    enabled: false
  extraArgs:
    publish-status-address: localhost

  ingressClassResource:
    name: nginx
    enabled: true
    default: true
  # KServe's RawDeployment ingress is created by its controller with the class
  # name we hand it, so this is belt-and-braces for anything hand-written.
  watchIngressWithoutClass: true

  # ONE replica, and it is not a capacity decision: the route is a hostPort on a
  # single named node, so a second replica could not schedule anywhere useful.
  # M5-S4 measures p95 through this pod; the PRR records what that means.
  replicaCount: 1

  # DISABLED DELIBERATELY, with the reason. The admission webhook validates
  # Ingress objects at create time; it costs an extra image, two Jobs and a
  # certificate to do it. Every Ingress in this program is GENERATED by the
  # KServe controller from an InferenceService, not hand-written, so the class of
  # mistake it catches cannot be made here — and the objects it would guard are
  # created by a controller that will simply retry. Re-enable it the day someone
  # hand-writes an Ingress.
  admissionWebhooks:
    enabled: false

  # ENABLED AT M6-S1, and it changes what is on the wire for a few seconds — the
  # controller Deployment rolls, which is the only route into this cluster. That
  # cost is recorded in ledgers/deployments.md rather than hidden, because it is
  # the first of M6's deliberate mutations (law 2).
  #
  # What it buys is the one instrument that sees a request which never reached a
  # pod: `nginx_ingress_controller_requests{status=…}` is counted at the edge, so
  # a 502/503 during a pod loss appears here and nowhere else (the predictor's own
  # counters cannot count a request its process never received). It is also the
  # per-backend counter M6-S4's canary is OBSERVED from — the split that actually
  # happened, as opposed to the weight that was asked for.
  #
  # The chart annotates the metrics Service with `prometheus.io/scrape`, which is
  # what the prometheus chart's default `kubernetes-service-endpoints` job keys
  # on, so no scrape config in infra/helm/monitoring/prometheus-values.yaml names
  # this component at all.
  metrics:
    enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
