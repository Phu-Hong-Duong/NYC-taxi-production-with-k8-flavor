# prometheus — helm values (M6-S1). Chart: prometheus-community/prometheus 29.27.0
# (appVersion v3.14.0), read live 2026-08-19 with `helm search repo … --versions`.
#
# WHY THE PLAIN CHART AND NOT kube-prometheus-stack. The stack chart installs the
# prometheus-operator plus ~10 CustomResourceDefinitions whose entire job is to
# turn ServiceMonitor/PodMonitor objects into the scrape config below. This
# cluster has exactly two things worth scraping (the predictor and the ingress
# controller) and one more that annotates itself (kube-state-metrics), so the
# operator would be a controller and a CRD schema standing between a reviewer and
# nine lines of YAML. Two further costs specific to THIS program: (a) CRDs are
# cluster-scoped state on a cluster that is stateful and must not be rebuilt, so
# a heavy install is a heavy thing to reverse; (b) M6-S2's alert rules would
# become PrometheusRule CRs — objects that live in the cluster and are edited by
# `kubectl`, when the program's rule since M1-S5 is that what renders is checked
# in and converged. The stack chart is the recorded fallback if this one hits its
# 3-attempt wall; nothing here depends on the operator's features.
#
# WHAT THIS SCRAPES, and where each number lands:
#   * the predictor (mlserver 1.7.1)  -> A-1 latency, A-2 5xx, A-3 422s, A-4 model
#   * ingress-nginx                   -> A-2 from the edge, the canary split (S4)
#   * kube-state-metrics              -> A-5 restarts/readiness
#   * the kubelet's cAdvisor          -> A-6 CPU + throttling (chart default job)
#
# WHAT IS TURNED OFF, and why it is not laziness:
#   * prometheus-node-exporter — a DaemonSet on all 3 nodes for HOST-level
#     metrics. Nothing in M6's alert plan or serving board reads one: container
#     CPU and CFS throttling come from the kubelet's cAdvisor endpoint, which the
#     chart's `kubernetes-nodes-cadvisor` job already scrapes. Footprint with no
#     reader is footprint.
#   * prometheus-pushgateway — M7's (drift metrics), and the M6 kickoff's
#     out-of-scope list names it by port. One value flips it on when M7 needs it.
#   * alertmanager stays ON: M6-S2 must watch an alert fire end to end, and an
#     alert with no receiver only ever exists as a row in Prometheus's UI.

scrapeConfigs:
  # A DEEP-MERGE ONTO THE CHART'S OWN JOB, not a copy of it. Helm merges maps by
  # key and REPLACES lists, so adding these two scalar/map keys leaves the
  # chart's 12-entry `relabel_configs` list exactly as the chart ships it —
  # which is the whole point: a copied relabel list would be right on the day it
  # was pasted and silently stale at the next chart bump (gotchas #49/#50 in
  # YAML).
  #
  # WHY THEY ARE NEEDED. KServe's controller advertises itself for scraping
  # (`prometheus.io/scrape: "true"` on kserve-controller-manager-metrics-service)
  # and then serves those metrics through kube-rbac-proxy over HTTPS with a
  # cert-manager certificate. Without these two keys the target is permanently
  # DOWN with `x509: cannot validate certificate`, and a permanently-red target
  # is worse than an absent one: it is what teaches an on-call to stop reading
  # the target list. `insecure_skip_verify` is honest here — the CA is
  # cert-manager's, in-cluster, and the alternative is mounting its root into
  # Prometheus for a metric nothing in M6 alerts on.
  kubernetes-service-endpoints:
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      insecure_skip_verify: true

serverFiles:
  # M6-S2 FILLED THIS IN, AND NOT HERE. The rules live in
  # `infra/monitoring/alerting_rules.yml` as a plain Prometheus rules file —
  # `promtool`-shaped, reviewable in a diff, and the ONLY copy — and
  # `scripts/render_alert_rules.py` nests them under this key at deploy time as a
  # second `--values` overlay, which helm merges on top of this map. Keeping the
  # empty map here is deliberate: it documents the key the overlay lands on, and
  # a run that somehow skipped the renderer would install zero rules rather than
  # fail obscurely. Editing rules HERE would create the twin this program has
  # been bitten by four times; a test fails if this map stops being empty.
  alerting_rules.yml: {}

extraScrapeConfigs: |
  # ---------------------------------------------------------------------------
  # The predictor's own metrics. THIS PORT WAS PROBED, NOT READ OFF A DOC.
  #
  # KServe stamps its own hint on the predictor pod:
  #     prometheus.kserve.io/path: /metrics
  #     prometheus.kserve.io/port: "8080"
  # …and on THIS runtime 8080/metrics is a 404. `scripts/probe_mlserver_metrics.py`
  # asked the live pod on 2026-08-19: :8080/metrics -> HTTP 404, :8082/metrics ->
  # HTTP 200 with 24 series, including model_infer_request_success_total,
  # model_infer_request_failure_total and rest_server_request_duration_seconds
  # (a histogram, i.e. a real p95) labelled by method/path/status_code.
  # A scrape config written against KServe's own annotation would have produced a
  # target that is permanently DOWN and a serving board that renders empty — the
  # same picture as "no traffic". Gotcha #70, asked of a second server.
  #
  # Discovery is by LABEL, not by pod name: every InferenceService KServe creates
  # carries `serving.kserve.io/inferenceservice`, so the shadow isvc M6-S3 adds
  # and the canary isvc M6-S4 adds are scraped the moment they exist, with the
  # isvc name as a label. Nothing in this file needs editing for them.
  - job_name: kserve-predictors
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [serving]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_serving_kserve_io_inferenceservice]
        action: keep
        regex: .+
      # …AND the pod must be a PREDICTOR (F-061, found by `verify-m8` on its own
      # first run). The rule above keeps every pod belonging to an
      # InferenceService, and the rule below forces mlserver's metrics port on
      # it — two assumptions that were the same assumption until M8-S4 put a
      # TRANSFORMER pod in this namespace. That pod belongs to an isvc, carries
      # the label, is not an mlserver and has nothing on 8082, so it became a
      # permanently-DOWN target: `up == 0` forever, on a signal whose entire
      # value (F-043) is that `up == 0` means a predictor has stopped reporting.
      # A standing false one is how a real one becomes invisible. KServe labels
      # the two components apart itself, so the discriminator is free.
      - source_labels: [__meta_kubernetes_pod_label_component]
        action: keep
        regex: predictor
      # One target per pod on the metrics port — NOT on the discovered container
      # port, which is the inference port and answers 404 here.
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: $1:8082
      - source_labels: [__meta_kubernetes_pod_label_serving_kserve_io_inferenceservice]
        target_label: inferenceservice
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
    metrics_path: /metrics
    scrape_interval: 15s

  # ---------------------------------------------------------------------------
  # The pushgateway (M7-S3). ONE FLAG IN HERE IS LOAD-BEARING AND IT IS
  # `honor_labels: true`.
  #
  # Prometheus normally OVERWRITES a scraped sample's `job` and `instance`
  # labels with the ones belonging to the target it scraped — which is correct
  # for a service reporting on itself and exactly wrong for a gateway reporting
  # on somebody else. Without this flag every drift series arrives labelled
  # `job="pushgateway"` instead of the `job="taxi-drift"` the pushing job set,
  # `exported_job` appears as a consolation prize, and EVERY RULE IN
  # `crosstown-drift` SELECTS ON A LABEL THAT NO LONGER EXISTS. The alerts do
  # not error — they match nothing, evaluate over nothing, and sit `inactive`
  # forever. That is gotcha #78's family: a rule that cannot fire looks
  # identical to a system with nothing wrong with it, and the only tell is that
  # a deliberately-drifted month produced silence.
  #
  # This is also why the gateway is NOT annotated for the generic
  # service-endpoints job (see `prometheus-pushgateway` below): two scrapes of
  # one gateway, one of them label-mangling, would produce two contradictory
  # copies of every drift number.
  # THE SERVICE NAME IS `prometheus-prometheus-pushgateway` AND IT WAS READ OFF
  # THE CLUSTER, NOT GUESSED. The subchart's fullname template prefixes the
  # RELEASE name (`prometheus`, `scripts/deploy_monitoring.sh:73`) to its own
  # chart name (`prometheus-pushgateway`), so the obvious address — the one
  # written here first — resolves to nothing. The tell was one line in
  # `/api/v1/targets`: `health: down`. Worth naming because a DOWN target is the
  # good outcome of this mistake; had the gateway also been annotated for the
  # generic endpoints job, it would have been scraped anyway, with its labels
  # mangled, and every drift rule would have sat quietly inactive instead
  # (gotcha #70's family: ask the server what its name is).
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["prometheus-prometheus-pushgateway.monitoring.svc.cluster.local:9091"]
    metrics_path: /metrics
    scrape_interval: 15s

server:
  global:
    # 15s, not the chart's 1m, AND IT WAS A DEFECT BEFORE IT WAS A PREFERENCE.
    # At a 1-minute scrape interval a `rate(x[1m])` has at most one sample in its
    # window and evaluates to NOTHING — so the first run of the accept check
    # reported three container panels with "0 series", which reads exactly like
    # "this container is idle" and is in fact "this board cannot draw". M6's
    # windows are minutes (a canary shift, a kill drill, a gameday injection);
    # a sampling interval of the same order as the event cannot describe it.
    scrape_interval: 15s
    evaluation_interval: 15s

  # 15 days is the chart default and it is the right one here: M6's windows are
  # minutes (a drill, a canary, a gameday) and M7's drift comparisons read MLflow
  # and the marts, not this TSDB. A longer retention would only buy disk.
  retention: "15d"

  persistentVolume:
    # The PVC dies with the cluster, like every other PVC here (M0-S4 proved it).
    # That is acceptable for a metrics store and would not be for the registry:
    # what a lost TSDB costs is the ability to re-read a window that has already
    # been written into a record. Every M6 number that matters is copied into a
    # tracked JSON at the time it is measured, for exactly this reason.
    enabled: true
    size: 8Gi

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

  # Reached through the EXISTING 8081 ingress (M6 law 1 — kind publishes host
  # ports at cluster-CREATE only, and this cluster is not rebuilding). Host-based,
  # so it shares the port with the predictor's own host without a path prefix
  # that Prometheus's UI would then have to be told about.
  #   curl -H 'Host: prometheus.local' http://localhost:8081/-/healthy
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - prometheus.local
    path: /
    pathType: Prefix

alertmanager:
  enabled: true
  persistence:
    # Alertmanager's persistence is its silences and notification log. Nothing in
    # M6 silences anything, and a lost notification log costs one duplicate
    # notification after a restart.
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

kube-state-metrics:
  # A-5's source (restarts, readiness, replica counts). It annotates its own
  # Service with prometheus.io/scrape, so the chart's default
  # `kubernetes-service-endpoints` job finds it without a line here.
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi

prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  # ON from M7-S3, and this is the one value M6-S1's note said would flip.
  #
  # WHY A BATCH JOB NEEDS ONE AT ALL. Everything scraped in this file is a
  # long-lived process with an HTTP endpoint. The drift job is neither: it runs
  # for a few minutes once a month and is gone long before any 15-second scrape
  # interval could find it. Pushgateway inverts the direction for exactly that
  # case — the job PUSHES, the gateway HOLDS, Prometheus scrapes the gateway.
  #
  # NO hostPort, and that is M7 law 1, not a preference. kind publishes host
  # ports at cluster-CREATE only and this cluster is stateful and not
  # rebuilding, so 9091 stays a RESERVED NAME in CLAUDE.md's port family exactly
  # as 3000 did through M6. In-cluster callers use the Service name; a human
  # reaches it with `kubectl port-forward`, which is the M4-S2 flyte-console
  # precedent for an honest deviation from the declared-route doctrine.
  #
  # THE SEMANTIC THAT SURPRISES PEOPLE, WRITTEN WHERE IT IS INSTALLED: a pushed
  # metric PERSISTS after its producer dies. The gateway is a bulletin board,
  # not a store of events. So "the drift metric is present and below the bar" is
  # equally consistent with "the drift job died in March and January's
  # reassuring number is still pinned to the wall". Two guards, deliberately in
  # two different layers: `push_metrics()` REFUSES a payload with no freshness
  # stamp (a type), and A-10 fires on a stamp older than 40 days (a rule).
  #
  # PERSISTENCE IS ON FROM M8-S1, AND IT WAS TURNED ON BY A MEASUREMENT (F-050).
  #
  # M7-S3 turned it off with an argument that is still true and was still the
  # wrong call: "the contents are re-derivable by re-running the drift job over
  # DVC-pinned data, so what a lost PVC costs is one command." What that argument
  # left out is WHO RUNS THE COMMAND. An emptyDir dies with the pod, and the pod
  # dies on every host restart — measured at three separate observations in the
  # 24 hours after F-050 was raised, twice within fourteen of them, because this
  # cluster lives on a laptop. Between the restart and somebody noticing, the
  # board renders empty and A-10 CANNOT FIRE: its expression is
  # `time() - max by (month)(...) > 3456000` and over zero series that is zero
  # series, not a large number. So the failure mode was "the drift surface is
  # silently gone, and the rule that exists to catch a silent drift surface is
  # the one thing that cannot see it" — gotcha #78 one layer up.
  #
  # The two halves land together and each is weak alone: this volume stops the
  # event that actually recurs here, and A-11 (`absent(...)`) catches the
  # deletions a volume cannot survive — a cluster rebuild, a wiped PVC. Without
  # the volume, A-11 would page for an ordinary reboot; with it, an absence
  # means somebody destroyed something.
  #
  # Honest costs, both real: this PVC dies with `make destroy` like every PVC in
  # this repo (that is what A-11 is for), and the values change ROLLS the gateway
  # once — losing whatever it held at that moment, which is why the drill
  # re-pushes the real numbers afterwards and the board ends carrying the truth.
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  # `strategy.type: Recreate` is the SUBCHART's own default (read out of
  # `helm show values prometheus-community/prometheus-pushgateway`, not assumed)
  # and it is what a RWO volume needs: kind's default provisioner is node-local,
  # so a surge pod would either dead-lock on multi-attach or land on a node the
  # data is not on. F-033 by construction rather than by repair.
  persistentVolume:
    enabled: true
    # The gateway holds ~30 series of a few hundred bytes each. This number is
    # nominal: kind's `standard` StorageClass is rancher local-path, which
    # provisions a host directory and enforces no quota. It is written small so
    # nobody reads it as a capacity claim.
    size: 128Mi
    mountPath: /data
    accessModes:
      - ReadWriteOnce
  extraArgs:
    # WITHOUT THIS FLAG THE VOLUME IS DECORATION. Pushgateway keeps its metrics
    # in memory and only writes them to a file when `--persistence.file` names
    # one; the chart mounts the volume either way, so a PVC with no flag looks
    # exactly like working persistence until the pod restarts.
    - --persistence.file=/data/pushgateway.data
    # The checkpoint interval bounds what an UNGRACEFUL stop loses. A clean
    # SIGTERM (a `kubectl delete pod`, a helm upgrade) makes pushgateway write
    # on exit, so the default 5m would have passed this story's own survival
    # drill — and would have lost the push on the failure this volume exists
    # for, which is a laptop being switched off. 10s costs a few kilobytes
    # written every ten seconds to hold a number that is produced monthly.
    - --persistence.interval=10s
  # NO `prometheus.io/scrape` ANNOTATION, DELIBERATELY — see the
  # `pushgateway` job in `extraScrapeConfigs` below. The annotation would get
  # the gateway scraped by the chart's generic `kubernetes-service-endpoints`
  # job, which does NOT set `honor_labels`, and that single missing flag would
  # silently break every drift rule in this repo.
