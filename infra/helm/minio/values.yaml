# MinIO — the S3 the whole program talks to (MLflow artifacts today; DVC remote,
# KServe model storage and Feast registry later).
#
# Chart: minio/minio  (repo https://charts.min.io/) — version pinned in
# scripts/deploy_platform.sh and recorded in the CLAUDE.md pin table. Every
# override below says WHY; anything not listed is the chart default on purpose.
#
# NOTE ON SECRETS: nothing secret is in this file. Root credentials come from the
# Secret `minio-root`, the mlflow user's secret key from `minio-mlflow-user` —
# both created by scripts/platform_secrets.sh out of .env (gitignored).

# One node, one drive. `distributed` (the chart default) wants 16 replicas ×
# drives; erasure coding across a single laptop's disk buys nothing and costs
# 16× the RAM.
mode: standalone
replicas: 1
drivesPerNode: 1

# The chart requests 16Gi by default — sized for a real MinIO fleet. On a 48 GB
# WSL VM shared with Postgres, MLflow, Flyte (M4), KServe (M5) and the monitoring
# stack (M6) that reservation is the whole budget for one service.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

persistence:
  enabled: true
  # 500Gi (the chart default) is a claim this laptop cannot honour; local-path
  # provisioning would accept it and then fail at the worst moment.
  size: 20Gi

# Root credentials live in a Secret, never in values. Keys `rootUser` /
# `rootPassword` are the names the chart looks for.
existingSecret: minio-root

# NodePorts are fixed, not random, because infra/kind/kind-config.yaml maps
# exactly these two node ports onto the CLAUDE.md host port family (9000/9001).
# Change one and you must change the other — they are twins.
service:
  type: NodePort
  port: "9000"
  nodePort: 30900
consoleService:
  type: NodePort
  port: "9001"
  nodePort: 30901

# Created by the chart's post-install mc Job. `purge: false` so a re-run never
# deletes artifacts — deploy-platform must be safe to run on a live stack.
buckets:
  - name: mlflow-artifacts
    policy: none
    purge: false
    versioning: false
  # Flyte's blob store (M4-S2). Flyte keeps workflow metadata, task inputs and
  # outputs, and the fast-registered code archives here. It gets its OWN bucket
  # rather than a prefix inside mlflow-artifacts so a bucket policy, a lifecycle
  # rule or a `mc rm --recursive` aimed at one orchestrator's scratch can never
  # reach the registry's artifacts. `purge: false` for the same reason as above.
  - name: flyte-data
    policy: none
    purge: false
    versioning: false

# Custom policies (M5-S2). The chart creates these after install, alongside
# MinIO's five built-ins.
#
# `serving-readonly` exists because MinIO's built-in `readonly` IS NOT ENOUGH and
# fails in a way worth writing down: it grants `s3:GetObject` and
# `s3:GetBucketLocation` and NOT `s3:ListBucket`, so KServe's storage-initializer
# — which HEADs the bucket and then lists the prefix before downloading — dies on
#
#     S3 error for s3://mlflow-artifacts/6/models/m-04478…/artifacts:
#     An error occurred (403) when calling the HeadBucket operation: Forbidden
#
# A 403 on a user that exists and a policy that says "readonly" reads exactly
# like a wrong password. Observed live 2026-08-19 (M5-S2), with
# `mc admin policy info` printing the built-in's two actions as the evidence.
#
# The replacement is also STRICTLY BETTER than what it replaces, which is why
# this is a fix and not a workaround: it is scoped to ONE bucket. `readonly` is
# bucket-WIDE read, the honest limit recorded on the `flyte` user below; this
# identity cannot see `flyte-data` at all.
policies:
  - name: serving-readonly
    statements:
      # The objects: fetch, never write. No PutObject, no DeleteObject, no
      # multipart — the storage-initializer downloads and that is all it does.
      - effect: Allow
        resources:
          - 'arn:aws:s3:::mlflow-artifacts/*'
        actions:
          - "s3:GetObject"
      # The bucket itself: locate it and list it. `ListBucket` is what the 403
      # above was about, and it is required twice over — once for the HeadBucket
      # probe and once to enumerate the model's prefix.
      - effect: Allow
        resources:
          - 'arn:aws:s3:::mlflow-artifacts'
        actions:
          - "s3:GetBucketLocation"
          - "s3:ListBucket"

# The chart ships a default user `console` / `console123` (a published password
# on an admin policy). Overriding the list removes it. MLflow gets its own
# identity with readwrite on the data path — the root account is for admin only,
# so a leaked MLflow credential cannot reconfigure the server.
# `accessKey` is an identity (a username), not a secret; the secret key comes
# from the Secret named here.
users:
  - accessKey: mlflow
    existingSecret: minio-mlflow-user
    existingSecretKey: secretKey
    policy: readwrite
  # Flyte's own identity (M4-S2), for the same reason MLflow has one: a leaked
  # orchestrator credential must not be able to reconfigure the server or read
  # the registry's artifacts. `readwrite` is MinIO's built-in policy and is
  # bucket-wide; narrowing it to flyte-data alone needs a custom policy document,
  # which is a real improvement and NOT free here (the chart has no hook for one)
  # — recorded as the honest limit rather than claimed as least privilege.
  - accessKey: flyte
    existingSecret: minio-flyte-user
    existingSecretKey: secretKey
    policy: readwrite
  # The SERVING identity (M5-S2), and the first one in this file that is
  # genuinely least-privilege: read-only AND scoped to ONE bucket, by the custom
  # policy above. KServe's storage-initializer downloads the champion's artifacts
  # and never writes a byte, so nothing about serving needs more — and this is
  # the credential most exposed by construction, because it lives in the
  # namespace a predictor pod runs in and travels with every pod restart, kill
  # drill (M5-S4) and rollback rehearsal (M5-S5). A leaked serving credential
  # must not be able to overwrite the model it reads: the policy is what makes
  # "the artifact that was gated is the artifact that serves" a property of the
  # store rather than a promise about who holds the key.
  - accessKey: serving
    existingSecret: minio-serving-user
    existingSecretKey: secretKey
    policy: serving-readonly
