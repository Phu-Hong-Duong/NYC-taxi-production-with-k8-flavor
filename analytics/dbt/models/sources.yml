version: 2

sources:
  - name: analyst
    description: >
      The DuckDB analyst layer built by `taxi_mlops.data.analyst` (M1-S2),
      attached read-only. Every view named here is a contract: the EDA report
      cites it, these marts read it, and M1-S5's boards render it. A view
      renamed there breaks `dbt build` here, which is the point — the
      alternative is two definitions of "a clean trip" drifting apart.
    database: analyst
    schema: main
    tables:
      - name: trips_clean
        description: "One row per accepted trip, 56,127,878 over 2019-01..08, labelled with its split and month from configs/train.yaml."
      - name: ingest_months
        description: "One row per ingested month: rows_in, rows_out, rows_rejected, rejected_fraction. Source of KPI-01 and KPI-02."
      - name: ingest_rejections
        description: "Per-rule drop counts (attributed and matched). Source of KPI-03."
      - name: data_health
        description: "ingest_months joined to the raw sha256 pins. Source of KPI-05."
      - name: unknown_domain_values
        description: "Values present in the data that the TLC dictionary does not describe. Related to KPI-04 — but see monthly_kpis: this view is pre-aggregated per column, so summing it double-counts rows carrying two undocumented values."
      - name: predictions
        description: >
          One row per held-out trip (val + test), written by
          `taxi_mlops.training.score` under `data/predictions/`: the five
          quote-time features the champion actually saw, the actual duration, the
          champion's quote and the honest floor's quote. MODEL OUTPUT, read
          through the analyst layer — the boundary law's one-way door (ADR-009):
          marts may read what the model wrote, model code never reads marts.
          Present only after `make predictions`; the whole data path builds
          without it.
      - name: scoring_months
        description: >
          One row per SCORING month (2020-01..03), written by the same ingest
          under `data/scoring/` (M7-S1): rows_in, rows_out, rows_rejected. The
          sibling of `ingest_months` and deliberately not the same view — the
          scoring months are not a fourth split, and a consumer that wants them
          has to ask for them by name. It is the reconciliation AUTHORITY for
          everything downstream of the scoring ingest.
      - name: scoring_predictions
        description: >
          One row per SCORING trip, written by `taxi_mlops.training.batch` under
          `data/scoring_predictions/` (M7-S2): the identity columns the champion
          saw, the pickup date, the actual duration and the champion's quote,
          stamped with the registry version that produced it. MODEL OUTPUT, read
          through the analyst layer (ADR-009's one-way door). There is no floor
          column: the floor is the gate's other half and a margin against it on
          2020 data would be a comparison no gate ever made. Present only after
          `make predictions-scoring`; the whole data path builds without it.
      - name: prediction_runs
        description: >
          Provenance for the rows above, read from the manifest the same command
          wrote: which registered model and version produced them, and what
          `taxi_mlops.training.evaluate` measured for it per split. The ONLY place
          KPI-09/KPI-10 values appear in this project's SQL, and they are read,
          never computed (gotcha #15 forbids a second producer). Never published
          to Postgres: its one consumer is the test that checks `error_segments`'
          whole-split row against the evaluator.
