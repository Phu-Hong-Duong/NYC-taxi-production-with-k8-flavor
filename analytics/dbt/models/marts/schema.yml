version: 2

# The DA's QA layer. PARALLEL TO, NOT REPLACING, the DE's pandera contracts
# (BLUEPRINT §9/M1-S6): pandera decides what may enter `data/processed/`; these
# tests decide what may be PUBLISHED to a board. They overlap on purpose — the
# accepted_range on trip_duration_minutes restates the contract's [1, 120]
# rejection rules, so a cleaning rule that stops working is caught a second time,
# by a different mechanism, on the way to the humans who would otherwise believe
# the number.
#
# Every test here has been SEEN FAILING — `make marts-redteam` unions the
# out-of-contract fixture in seeds/redteam/ and the run must go red (DA charter:
# never ship a mart whose tests were never seen failing; gotcha #29).

models:
  - name: trips_clean
    description: >
      Published trip-level fact: every accepted trip 2019-01..08 with the four
      segment dimensions computed once. Serves humans (ADR-009, gotcha #22).
    columns:
      - name: split
        description: "train / val / test, a literal from configs/train.yaml — never parsed from a filename."
        tests:
          - not_null
          - accepted_values:
              arguments: {values: ["train", "val", "test"]}
      - name: month
        tests: [not_null]
      - name: PULocationID
        description: "TLC taxi zone. 264/265 are 'unknown', not places."
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 1, max_value: 265}
      - name: DOLocationID
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 1, max_value: 265}
      - name: trip_duration_minutes
        description: "The target. Bounded [1, 120] by the contract's rejection rules — this test is that bound, restated where a board can trip over it."
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 1, max_value: 120}
      - name: trip_distance
        description: "The METER'S DRIVEN distance — not available when an ETA is quoted (F-007). Fine for a human board, a leak for a model."
        tests:
          - accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: pickup_hour
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0, max_value: 23}

  - name: zone_hourly_stats
    description: "Duration/speed/fare by (month, split, pickup zone, hour). At most 50,880 rows."
    columns:
      - name: trips
        tests: [not_null]
      - name: pickup_hour
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0, max_value: 23}
      - name: median_duration_min
        tests:
          - accepted_range:
              arguments: {min_value: 1, max_value: 120}
      - name: kpi_08_excluded_rows
        description: "KPI-08's window renders next to its value, by rule."
        tests: [not_null]

  - name: monthly_kpis
    description: "One row per month, one column per KPI id from docs/kpi_definitions.md."
    columns:
      - name: month
        tests: [not_null, unique]
      - name: kpi_01_trips_ingested
        tests: [not_null]
      - name: kpi_02_rejection_rate_pct
        description: >
          Plotted as a SERIES, never as a threshold: the ingest refuses a month
          above 10%, which is 5x the worst month observed and would not have
          noticed the 41% relative rise across these eight months. The bound here
          is the contract's `max_rejected_fraction`, so a month that somehow got
          past ingest cannot get onto a board.
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0, max_value: 10}
      - name: kpi_04_undocumented_pct
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: kpi_05_raw_sha256
        description: "The pin of the bytes these numbers describe. Null here means the board should say so rather than render."
        tests: [not_null]
      - name: kpi_06_median_duration_min
        tests:
          - accepted_range:
              arguments: {min_value: 1, max_value: 120}
      - name: kpi_08_excluded_rows
        tests: [not_null]

  - name: rejections_by_rule
    description: "KPI-03 at (month, rule) grain — the only grain it is defined on."
    columns:
      - name: rule
        tests: [not_null]
      - name: rejected_by
        description: "First-violated attribution; sums exactly to rows dropped."
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0}
      - name: matched
        description: "Independent hits. Greater than rejected_by for any rule shadowed by an earlier one."
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0}

  - name: error_segments
    description: >
      Where the champion is wrong, at (split, segment, segment_value) grain, with
      the honest floor's error on the same rows. Aggregates the evaluator's
      published row-level predictions; computes no prediction and re-scores no
      model. Serves M2-S4's error memo and the error-segment board.
    columns:
      - name: split
        description: "val (2019-07) or test (2019-08). Train is never scored — a model's error on the rows it was fitted to is not a finding."
        tests:
          - not_null
          - accepted_values:
              arguments: {values: ["val", "test"]}
      - name: segment
        description: "Which dimension this row cuts by: overall, hour, dayofweek, pickup_zone, dropoff_zone, passenger_count, duration_band, unseen_group."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["overall", "hour", "dayofweek", "pickup_zone", "dropoff_zone",
                         "passenger_count", "duration_band", "unseen_group"]
      - name: segment_value
        tests: [not_null]
      - name: trips
        description: "Rows in the segment. Summed over any one segment type it equals the split's row count, which is what assert_error_segments_reconcile checks."
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 1}
      - name: kpi_11_mae_min
        description: >
          KPI-11 — segment ETA MAE in minutes. On the `overall` row this equals
          KPI-09, by construction and by test; it is a different id because its
          window is a segment (docs/kpi_definitions.md rule 5).
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0, max_value: 120}
      - name: kpi_12_within_tol_pct
        description: "KPI-12 — segment within-tolerance rate, percent. Tolerance comes from configs/train.yaml and rides in `tolerance_minutes` on every row."
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: kpi_13_margin_vs_floor_pct
        description: >
          KPI-13 — what the booster buys over the honest floor here, as a percent
          of the floor's MAE. NEGATIVE means the `GROUP BY` wins in this segment.
          No accepted_range: bounding it would be bounding the finding.
        tests: [not_null]
      - name: floor_mae_min
        description: "The group-median floor's MAE on the identical rows — the gate's bar, per segment."
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0, max_value: 120}
      - name: tolerance_minutes
        description: "KPI-12's tolerance, published ON the row so a card can never render the rate without it (KPI-08's rule, applied to a rate)."
        tests: [not_null]

seeds:
  - name: redteam_bad_trips
    description: >
      Out-of-contract fixture rows, used ONLY by `make marts-redteam`
      (`--vars '{red_team: true}'`). Never unioned by `make marts`.
